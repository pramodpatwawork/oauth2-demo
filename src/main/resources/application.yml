# Converted from application.properties
# Keep this file if you prefer YAML-based Spring config
# OAuth2 client configuration for Facebook
# Replace the client-id and client-secret via environment variables or a secure secrets store.
# Example (Windows cmd):
#   setx FACEBOOK_CLIENT_ID "your-client-id"
#   setx FACEBOOK_CLIENT_SECRET "your-client-secret"
# The properties below read from the environment variables by default.
spring:
  application:
    name: oauth2-demo
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          facebook:
            client-id: Facebook app Id
            client-secret: facebook app secret
            scope:
              - public_profile
              - email
